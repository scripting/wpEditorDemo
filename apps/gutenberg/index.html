<html>
	<head>
		<title>Gutenberg</title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="https://s3.amazonaws.com/scripting.com/code/includes/jquery-1.9.1.min.js"></script>
		<link href="https://s3.amazonaws.com/scripting.com/code/includes/bootstrap.css" rel="stylesheet">
		<script src="https://s3.amazonaws.com/scripting.com/code/includes/bootstrap.min.js"></script>

		<link rel="stylesheet" href="https://s3.amazonaws.com/scripting.com/code/fontawesome/css/all.css">
		<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Ubuntu:400,400i,500i,700" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Rancho" rel="stylesheet">

		<script src="https://s3.amazonaws.com/scripting.com/code/includes/basic/code.js?x=2"></script>
		<link href="https://s3.amazonaws.com/scripting.com/code/includes/basic/styles.css" rel="stylesheet" type="text/css">

		<script src="https://s3.amazonaws.com/scripting.com/code/wpidentity/client/api2.js?x=0"></script>

		<!-- Turndown: HTML to Markdown conversion -->
		<script src="https://unpkg.com/turndown/dist/turndown.js"></script>

		<!-- React must load before isolated-block-editor -->
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

		<!-- Gutenberg isolated block editor -->
		<script src="https://unpkg.com/@automattic/isolated-block-editor@2.30.0/build-browser/isolated-block-editor.js"></script>
		<link rel="stylesheet" href="https://unpkg.com/@automattic/isolated-block-editor@2.30.0/build-browser/core.css"/>
		<link rel="stylesheet" href="https://unpkg.com/@automattic/isolated-block-editor@2.30.0/build-browser/isolated-block-editor.css"/>

		<script src="code.js"></script>
		<link rel="stylesheet" href="styles.css"/>
		</head>
	<body>
		<div class="divMenubar" id="idMenubar">
			<div class="topbar-wrapper" style="z-index: 5;">
				<div class="navbar navbar-fixed-top" data-dropdown="dropdown">
					<div class="navbar-inner">
						<div class="container">
							<a class="brand" href="/" title="Gutenberg editor plugged into wpIdentity.">
								<span class="spMenuProductName">Gutenberg</span>
								</a>
							<ul class="nav">
								<li class="dropdown" id="idMainMenu">
									<a href="#" class="dropdown-toggle" data-toggle="dropdown">Menu&nbsp;<b class="caret"></b></a>
									<ul class="dropdown-menu">
										<li><a onclick="aboutCommand ();">About Gutenberg..</a></li>
										<li class="divider"></li>
										<li><a onclick="newDraftCommand ();">New post..</a></li>
										<li><a onclick="setTitleCommand ();">Set title..</a></li>
										<li class="divider"></li>
										<li><a href="https://github.com/scripting/wpEditorDemo">GitHub repo</a></li>
										<li class="divider"></li>
										<li><a onclick="logOffWordpressCommand ();">Log off WordPress.com</a></li>
										</ul>
									</li>
								<li class="dropdown">
									<a href="#" class="dropdown-toggle" data-toggle="dropdown">Docs&nbsp;<b class="caret"></b></a>
									<ul class="dropdown-menu">
										<li><a href="../../docs/developers.md" target="_blank">Developer guide</a></li>
										<li><a href="../../docs/ai.md" target="_blank">AI guide</a></li>
										<li><a href="worknotes.md" target="_blank">Worknotes</a></li>
										</ul>
									</li>
								</ul>
						<span class="spVersion">v0.4.8</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		<div class="divPageBody">
			<div class="divSignedOn" id="idSignedOn" style="display: none;">

				<div class="divEditorContainer">
					<div class="divTopLine">
						<div class="divTitle">
							</div>
						<div class="divStatus">
							<div class="divSavingMessage">
								</div>
							</div>
						</div>
					<div class="divEditor">
						</div>
					<div class="divButtonLine">
						<div class="divLeftButtons">
							<button id="idNewPostButton" class="btn btnPost" type="button" onclick="newDraftCommand ()">
								New Post..
								</button>
							<button id="idChooseSiteButton" class="btn btnPost" type="button" onclick="chooseSiteButtonClick ()">
								Choose site
								</button>

							<div class="spLastSiteChosen"></div>

							</div>
						<div class="divRightButtons">
							<button id="idViewPostButton" class="btn btnPost" type="button" onclick="viewPostCommand ()">
								View Post..
								</button>
							<button id="idPostButton" class="btn btnPost" type="button" onclick="publishButtonClick ()">
								Publish
								</button>
							</div>
						</div>
					</div>
				<div class="divDraftDataViewer">
					</div>

				<div class="divSitelistContainer">
					</div>
				</div>
			<div class="divSignedOff" id="idSignedOff" style="display: none;">
				<p>Click the button to log on to WordPress.com.</p>
				<p><img alt="" src="https://s0.wp.com/i/wpcc-button.png" width="231" onclick="myWordpress.connectWithWordpress ()"></p>
				</div>
			</div>
		<script>
			$(document).ready (function () {
				startup ();
				});
			</script>
		</body>
	</html>
